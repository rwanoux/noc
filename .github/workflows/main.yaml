name: Publication du système

# Se lance quand une « Release » est publiée sur GitHub (tag du type v2.0.0).
# Elle génère les compendiums et joint au release system.json et system.zip.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # version = tag sans le « v » ; liens de manifeste et de téléchargement vers ce dépôt
      - name: Renseigner system.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" \
             --arg url "https://github.com/$REPO" \
             --arg manifest "https://github.com/$REPO/releases/latest/download/system.json" \
             --arg download "https://github.com/$REPO/releases/download/$TAG/system.zip" \
             '.version=$v | .url=$url | .manifest=$manifest | .download=$download' \
             system.json > system.tmp && mv system.tmp system.json
          cat system.json | head -20

      - name: Installer les dépendances
        run: npm ci

      - name: Générer les compendiums
        run: npm run compendiums

      - name: Créer l'archive
        run: zip -r ./system.zip system.json template.json LICENSE.txt asset/ css/ lang/ module/ templates/ packs/

      - name: Joindre les fichiers au release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "./system.json, ./system.zip"
          tag: ${{ github.event.release.tag_name }}
